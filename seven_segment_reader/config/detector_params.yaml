seven_segment_reader_node:
  ros__parameters:
    # IPカメラサーバー設定
    server_url: "http://127.0.0.1:5000"

    # Roboflowモデル設定
    model_name: "7-segment-display-gxhnj"
    model_version: "2"
    api_key: ""

    # 検出パラメータ
    confidence_threshold: 0.5
    iou_threshold: 0.5
    overlap_threshold: 0.7

    # 処理設定
    processing_interval: 0.1  # 秒

    # DOI領域の設定（左上x, 左上y, 右下x, 右下y）
    # 例: 複数の領域を設定する場合
    doi_regions: "237,25,544,342"  # 領域1: (237,25)から(544,342)

    # ログ設定
    log_level: "INFO"
    log_file_prefix: "seven_segment_detection"
