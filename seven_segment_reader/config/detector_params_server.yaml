seven_segment_reader_server_node:
  ros__parameters:
    # IPカメラクロッピングサーバー設定
    server_url: "http://127.0.0.1:5000"

    # Inference Server設定
    inference_server_url: "http://localhost:9001"

    # Roboflowモデル設定
    model_name: "7-segment-display-gxhnj"
    model_version: "2"

    # 検出パラメータ
    confidence_threshold: 0.5
    iou_threshold: 0.5
    overlap_threshold: 0.7

    # 処理設定
    processing_interval: 0.1  # 秒

    # DOI領域数（ip_cam_cropping.pyで処理済み画像のDOI数）
    doi_count: 4

    # GPU設定
    use_gpu: true  # GPU使用フラグ
    gpu_device_id: 0  # GPUデバイスID（複数GPUがある場合）

    # ログ設定
    log_level: "INFO"
    log_file_prefix: "seven_segment_detection"
