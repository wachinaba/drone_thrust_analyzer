      seek_current_ma_max: 500
      seek_current_ma_step: 50
      seek_ramp_stage_ms: 500.0
      move_min_mm: 0.2
      hold_time_ms: 150
      backoff_mm: 1.0
      timeout_s: 120.0
      max_seek_time_s: 60.0
      max_travel_mm: 300.0
      backoff_current_ma: 200
      backoff_profile_vel_mm_s: 20.0
      backoff_profile_acc_mm_s2: 200.0
      backoff_timeout_s: 3.0
      return_to_zero_timeout_s: 5.0
      return_to_zero_tolerance_mm: 0.05
      return_to_zero_monitor: true
    profile:
      max_vel_mm_s: 50.0
      max_acc_mm_s2: 500.0


